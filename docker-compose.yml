services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workshop_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshop-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    networks:
      - workshop-network

volumes:
  postgres_data:

networks:
  workshop-network:
    driver: bridge
